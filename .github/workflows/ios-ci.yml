name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and smoke build
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select supported Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Validate project and shared scheme
        run: |
          set -euo pipefail
          plutil -lint 75Hard.xcodeproj/project.pbxproj
          xcodebuild -project 75Hard.xcodeproj -scheme 75Hard -list

      - name: Create isolated simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl create \
            '75Hard CI' \
            'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' \
            'com.apple.CoreSimulator.SimRuntime.iOS-18-5')"
          echo "SIMULATOR_ID=${simulator_id}" >> "${GITHUB_ENV}"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project 75Hard.xcodeproj \
            -scheme 75Hard \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Run static analysis
        run: |
          set -euo pipefail
          xcodebuild \
            -project 75Hard.xcodeproj \
            -scheme 75Hard \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/AnalyzeData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            analyze

      - name: Build Release smoke artifact
        run: |
          set -euo pipefail
          xcodebuild \
            -project 75Hard.xcodeproj \
            -scheme 75Hard \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/ReleaseData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Remove isolated simulator
        if: always()
        run: |
          if [[ -n "${SIMULATOR_ID:-}" ]]; then
            xcrun simctl delete "${SIMULATOR_ID}" || true
          fi
